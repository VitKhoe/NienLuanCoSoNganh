<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị - Switch</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/social.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a class="navbar-brand" href="/">Switch</a>
      <button class="navbar-toggle" id="menuToggle" type="button" aria-label="Mở menu">☰</button>
      <ul class="navbar-menu" id="menu">
        <li><a class="nav-link time-font" href="/">Trang chủ</a></li>
        <li><a class="nav-link time-font" href="/friends.html">Bạn bè</a></li>
        <li><a class="nav-link time-font" href="/chat.html">Tin nhắn</a></li>
        <li><a class="nav-link time-font" href="/duan.html">WorkSpaces</a></li>

        <li><a class="nav-link time-font" href="/account.html" id="btnAccount">Tài khoản</a></li>
      </ul>
    </div>
  </nav>

  <main class="container" style="margin-top: 20px;">
    <h2>⚙️ Trang quản trị</h2>
    <p id="adminMsg" class="message" hidden></p>

    <section id="statsCards" style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;"></section>

    <section class="card">
      <div class="card-body">
        <h3 class="card-title">👥 Người dùng</h3>
        <table id="userTable" style="width:100%;border-collapse:collapse;">
          <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Họ tên</th><th>Trạng thái</th><th>Quyền</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card" style="margin-top:20px;">
      <div class="card-body">
        <h3 class="card-title">📜 Nhật ký hoạt động</h3>
        <ul id="activityLog" class="skill-list"></ul>
      </div>
    </section>
  </main>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
