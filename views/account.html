<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tài khoản</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/account.css">
  </head>
  <body>

    <!-- ===== Thanh điều hướng ===== -->
    <nav class="navbar">
      <div class="container navbar-inner">
        <a class="navbar-brand" href="/">Switch</a>

        <button class="navbar-toggle" id="menuToggle" type="button"
          aria-label="Mở menu">☰</button>

        <ul class="navbar-menu" id="menu">
          <li><a class="nav-link time-font" href="/">Trang chủ</a></li>
          <li><a class="nav-link time-font" href="/friends.html">Bạn bè</a></li>
          <li><a class="nav-link time-font" href="/chat.html">Tin nhắn</a></li>
          <li><a class="nav-link time-font" href="/duan.html">WorkSpaces</a></li>
          <li><a class="nav-link time-font" href="/pj_detail.html">My Projects</a></li>
          <li><a class="nav-link time-font" href="#" id="btnLogout">Đăng xuất</a></li>
          <li><a class="nav-link time-font" href="#" id="btnAccount">Tài khoản</a></li>
        </ul>
      </div>
    </nav>

    <main class="container account-layout">

      <!-- ===== 1. Hồ sơ cá nhân (Bảng user + hoso) ===== -->
      <section class="card">
        <div class="card-body">
          <h2 class="card-title">Hồ sơ cá nhân</h2>

          <div class="profile-head">
            <div class="avatar-lg" id="avatarPreview">?</div>
            <div>
              <h3 class="profile-name" id="profileUserName"></h3>
              <small class="text-muted" id="profileEmail"></small>
            </div>
          </div>

          <p id="profileMessage" class="message" hidden></p>

          <form id="formProfile">
            <div class="form-group">
              <label for="HovaTen">Họ và tên <span class="required">*</span></label>
              <input type="text" id="HovaTen" maxlength="255" required>
            </div>
            <div class="form-group">
              <label for="avatar">Ảnh đại diện</label>
              <input type="text" id="avatar" maxlength="500" placeholder="Dán link ảnh hoặc chọn file bên dưới">
              <input type="file" id="avatarFile" accept="image/*" style="margin-top: 6px;">
            </div>
            <div class="form-group">
              <label for="anhBia">Ảnh bìa (đường dẫn ảnh)</label>
              <input type="text" id="anhBia" maxlength="500" placeholder="https://...">
            </div>
            <div class="form-group">
              <label for="SDT">Số điện thoại</label>
              <input type="text" id="SDT" maxlength="20" placeholder="VD: 0901234567">
            </div>
            <div class="form-group">
              <label for="tieuSu">Tiểu sử</label>
              <textarea id="tieuSu" rows="4" maxlength="2000"
                placeholder="Giới thiệu ngắn về bạn..."></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Lưu hồ sơ</button>
            </div>
          </form>
        </div>
      </section>

      <!-- ===== 2. Kỹ năng chuyên môn (Bảng ky_nang + nhan_su_ky_nang) ===== -->
      <section class="card">
        <div class="card-body">
          <h2 class="card-title">Kỹ năng chuyên môn</h2>

          <p id="skillMessage" class="message" hidden></p>

          <!-- Danh sách kỹ năng đã khai báo -->
          <ul id="skillList" class="skill-list"></ul>

          <form id="formSkill">
            <input type="hidden" id="editingSkillId" value="">

            <div class="skill-form-row">
              <div class="form-group">
                <label for="tenKyNang">Kỹ năng <span class="required">*</span></label>
                <!-- Gợi ý từ danh mục bảng ky_nang, hoặc cho phép gõ mới -->
                <input type="text" id="tenKyNang" list="kyNangSuggestions" maxlength="100"
                  placeholder="Chọn hoặc nhập kỹ năng (VD: Node.js, AutoCAD...)" required>
                <datalist id="kyNangSuggestions"></datalist>
              </div>

              <div class="form-group">
                <label for="nhomNganh">Nhóm ngành</label>
                <input type="text" id="nhomNganh" maxlength="100"
                  placeholder="VD: Kỹ thuật phần mềm, Xây dựng..." value="Chung">
              </div>

              <div class="form-group">
                <label for="capDo">Cấp độ (1 - 4)</label>
                <select id="capDo">
                  <option value="1">1 - Cơ bản</option>
                  <option value="2">2 - Khá</option>
                  <option value="3">3 - Thành thạo</option>
                  <option value="4">4 - Chuyên gia</option>
                </select>
              </div>

              <div class="form-group">
                <label for="soNamKinhNghiem">Số năm kinh nghiệm</label>
                <input type="number" id="soNamKinhNghiem" min="0" max="60" step="0.5" value="0">
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" id="btnCancelSkill" hidden>Hủy sửa</button>
              <button type="submit" class="btn btn-success" id="btnSaveSkill">Thêm kỹ năng</button>
            </div>
          </form>
        </div>
      </section>

      <!-- ===== 3. Chứng chỉ & Bằng cấp chuyên môn (Bảng nhan_su_chung_chi) ===== -->
      <section class="card">
        <div class="card-body">
          <h2 class="card-title">Chứng chỉ & Bằng cấp chuyên môn</h2>

          <p id="certMessage" class="message" hidden></p>

          <!-- Danh sách chứng chỉ đã kê khai -->
          <ul id="certList" class="skill-list"></ul>

          <form id="formCert">
            <input type="hidden" id="editingCertId" value="">

            <div class="skill-form-row">
              <div class="form-group">
                <label for="tenChungChi">Tên chứng chỉ / Bằng cấp <span class="required">*</span></label>
                <input type="text" id="tenChungChi" maxlength="255"
                  placeholder="VD: AWS Solutions Architect, Chứng chỉ hành nghề..." required>
              </div>

              <div class="form-group">
                <label for="toChucCap">Tổ chức cấp <span class="required">*</span></label>
                <input type="text" id="toChucCap" maxlength="255"
                  placeholder="VD: Amazon, PMI, Bộ Xây Dựng..." required>
              </div>

              <div class="form-group">
                <label for="maChungChi">Mã số chứng chỉ</label>
                <input type="text" id="maChungChi" maxlength="100"
                  placeholder="Mã tra cứu (nếu có)">
              </div>
            </div>

            <div class="skill-form-row">
              <div class="form-group">
                <label for="ngayCap">Ngày cấp <span class="required">*</span></label>
                <input type="date" id="ngayCap" required>
              </div>

              <div class="form-group">
                <label for="ngayHetHan">Ngày hết hạn (bỏ trống nếu vĩnh viễn)</label>
                <input type="date" id="ngayHetHan">
              </div>

              <div class="form-group">
                <label for="certDriveUrl">Link minh chứng Google Drive</label>
                <input type="url" id="certDriveUrl" maxlength="500"
                  placeholder="https://drive.google.com/...">
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" id="btnCancelCert" hidden>Hủy sửa</button>
              <button type="submit" class="btn btn-success" id="btnSaveCert">Thêm chứng chỉ</button>
            </div>
          </form>
        </div>
      </section>

      <!-- ===== 4. Học vấn (Bảng hoc_van) ===== -->
      <section class="card">
        <div class="card-body">
          <h2 class="card-title">Học vấn</h2>
          <p id="hocVanMessage" class="message" hidden></p>
          <ul id="hocVanList" class="skill-list"></ul>

          <form id="formHocVan">
            <div class="skill-form-row">
              <div class="form-group">
                <label for="truongHoc">Trường <span class="required">*</span></label>
                <input type="text" id="truongHoc" maxlength="255" placeholder="VD: Đại học Bách Khoa" required>
              </div>
              <div class="form-group">
                <label for="chuyenNganh">Chuyên ngành</label>
                <input type="text" id="chuyenNganh" maxlength="255" placeholder="VD: Công nghệ thông tin">
              </div>
              <div class="form-group">
                <label for="bangCap">Bằng cấp</label>
                <select id="bangCap">
                  <option value="">-- Chọn --</option>
                  <option value="Trung cấp">Trung cấp</option>
                  <option value="Cao đẳng">Cao đẳng</option>
                  <option value="Cử nhân">Cử nhân</option>
                  <option value="Kỹ sư">Kỹ sư</option>
                  <option value="Thạc sĩ">Thạc sĩ</option>
                  <option value="Tiến sĩ">Tiến sĩ</option>
                </select>
              </div>
            </div>
            <div class="skill-form-row">
              <div class="form-group">
                <label for="namBatDau">Năm bắt đầu</label>
                <input type="number" id="namBatDau" min="1950" max="2100" placeholder="VD: 2020">
              </div>
              <div class="form-group">
                <label for="namKetThuc">Năm tốt nghiệp</label>
                <input type="number" id="namKetThuc" min="1950" max="2100" placeholder="VD: 2024">
              </div>
            </div>
            <div class="form-group">
              <label for="moTaHocVan">Mô tả</label>
              <textarea id="moTaHocVan" rows="2" maxlength="2000" placeholder="Thành tích, hoạt động nổi bật..."></textarea>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-secondary" id="btnCancelHocVan" hidden>Hủy sửa</button>
              <button type="submit" class="btn btn-success" id="btnSaveHocVan">Thêm học vấn</button>
            </div>
          </form>
        </div>
      </section>

      <!-- ===== 5. Kinh nghiệm làm việc (Bảng kinh_nghiem) ===== -->
      <section class="card">
        <div class="card-body">
          <h2 class="card-title">Kinh nghiệm làm việc</h2>
          <p id="kinhNghiemMessage" class="message" hidden></p>
          <ul id="kinhNghiemList" class="skill-list"></ul>

          <form id="formKinhNghiem">
            <div class="skill-form-row">
              <div class="form-group">
                <label for="tenCongTy">Công ty / Tổ chức <span class="required">*</span></label>
                <input type="text" id="tenCongTy" maxlength="255" placeholder="VD: Công ty ABC" required>
              </div>
              <div class="form-group">
                <label for="viTri">Vị trí</label>
                <input type="text" id="viTri" maxlength="255" placeholder="VD: Nhân viên marketing">
              </div>
            </div>
            <div class="skill-form-row">
              <div class="form-group">
                <label for="ngayBatDau">Ngày bắt đầu</label>
                <input type="date" id="ngayBatDau">
              </div>
              <div class="form-group">
                <label for="ngayKetThuc">Ngày kết thúc (bỏ trống nếu đang làm)</label>
                <input type="date" id="ngayKetThuc">
              </div>
            </div>
            <div class="form-group">
              <label for="moTaKinhNghiem">Mô tả công việc</label>
              <textarea id="moTaKinhNghiem" rows="2" maxlength="2000" placeholder="Mô tả nhiệm vụ, thành tích..."></textarea>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-secondary" id="btnCancelKinhNghiem" hidden>Hủy sửa</button>
              <button type="submit" class="btn btn-success" id="btnSaveKinhNghiem">Thêm kinh nghiệm</button>
            </div>
          </form>
        </div>
      </section>

    </main>

    <script type="module" src="/js/account.js"></script>
    <script type="module" src="/js/account2.js"></script>
  </body>
</html>
